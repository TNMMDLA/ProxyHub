name: proxyhub

services:
  proxyhub-server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-file:/app/data/proxyhub.db}
      WEB_ORIGIN: ${WEB_ORIGIN:-https://localhost}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      AGENT_URL: http://proxyhub-agent:3001
      AGENT_TOKEN: ${AGENT_TOKEN:?Set AGENT_TOKEN in .env}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
      RULE_SET_MAX_BYTES: ${RULE_SET_MAX_BYTES:-5242880}
      RULE_SET_MAX_RULES: ${RULE_SET_MAX_RULES:-50000}
      RULE_SET_FETCH_TIMEOUT_MS: ${RULE_SET_FETCH_TIMEOUT_MS:-10000}
      RULE_SET_MAX_REDIRECTS: ${RULE_SET_MAX_REDIRECTS:-3}
      RULE_SET_ALLOW_HTTP: ${RULE_SET_ALLOW_HTTP:-false}
      PROXYHUB_DIAGNOSTICS_ENABLED: ${PROXYHUB_DIAGNOSTICS_ENABLED:-true}
      PROXYHUB_DIAGNOSTICS_CACHE_TTL_MS: ${PROXYHUB_DIAGNOSTICS_CACHE_TTL_MS:-10000}
      PROXYHUB_DIAGNOSTICS_DEEP_TIMEOUT_MS: ${PROXYHUB_DIAGNOSTICS_DEEP_TIMEOUT_MS:-30000}
      PROXYHUB_DIAGNOSTICS_MAX_HISTORY: ${PROXYHUB_DIAGNOSTICS_MAX_HISTORY:-20}
      PROXYHUB_DIAGNOSTICS_MAX_BACKUPS: ${PROXYHUB_DIAGNOSTICS_MAX_BACKUPS:-50}
      PROXYHUB_NETWORK_PERF_TIMEOUT_MS: ${PROXYHUB_NETWORK_PERF_TIMEOUT_MS:-120000}
      PROXYHUB_TRAFFIC_ACCOUNTING_INTERVAL_MS: ${PROXYHUB_TRAFFIC_ACCOUNTING_INTERVAL_MS:-30000}
      PROXYHUB_STATE_DIR: /var/lib/proxyhub/state
      PROXYHUB_BACKUP_DIR: /var/lib/proxyhub/backups
    volumes:
      - proxyhub-data:/app/data
      - type: bind
        source: ${PROXYHUB_STATE_DIR:-./.proxyhub/state}
        target: /var/lib/proxyhub/state
        read_only: true
      - type: bind
        source: ${PROXYHUB_BACKUP_DIR:-./backups}
        target: /var/lib/proxyhub/backups
        read_only: true
    depends_on:
      proxyhub-agent:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then(async r=>{const b=await r.json();if(!r.ok||b?.success!==true||b?.data?.status!=='ok')process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 15s
    networks: [proxyhub]
    logging: &default-logging
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

  proxyhub-web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1/']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks: [proxyhub]
    logging: *default-logging

  proxyhub-agent:
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
      args:
        XRAY_CORE_VERSION: 26.5.9
    restart: unless-stopped
    pid: service:xray
    environment:
      NODE_ENV: production
      AGENT_TOKEN: ${AGENT_TOKEN:?Set AGENT_TOKEN in .env}
      XRAY_BINARY: /usr/local/bin/xray
      XRAY_CONFIG_PATH: /etc/xray/config.json
      XRAY_RESTART_SIGNAL: /var/run/proxyhub/restart
      XRAY_APPLIED_PATH: /var/run/proxyhub/applied
      XRAY_PID_PATH: /var/run/proxyhub/xray.pid
      XRAY_HEARTBEAT_PATH: /var/run/proxyhub/xray.heartbeat
      XRAY_PROBE_HOST: host.docker.internal
      XRAY_METRICS_URL: http://host.docker.internal:11111/debug/vars
      XRAY_HEALTH_TIMEOUT_MS: ${XRAY_HEALTH_TIMEOUT_MS:-12000}
      REALITY_COMPATIBILITY_TIMEOUT_MS: ${REALITY_COMPATIBILITY_TIMEOUT_MS:-20000}
      PROXYHUB_NETWORK_PERF_TARGETS_JSON: ${PROXYHUB_NETWORK_PERF_TARGETS_JSON:-}
      PROXYHUB_NETWORK_PERF_TIMEOUT_MS: ${PROXYHUB_NETWORK_PERF_TIMEOUT_MS:-120000}
      PROXYHUB_NETWORK_PERF_TARGET_TIMEOUT_MS: ${PROXYHUB_NETWORK_PERF_TARGET_TIMEOUT_MS:-20000}
      PROXYHUB_NETWORK_PERF_NODE_HOST: ${PROXYHUB_NETWORK_PERF_NODE_HOST:-host.docker.internal}
      PROXYHUB_NETWORK_PERF_TEST_MODE: ${PROXYHUB_NETWORK_PERF_TEST_MODE:-false}
    volumes:
      - xray-config:/etc/xray
      - xray-runtime:/var/run/proxyhub
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3001/status',{headers:{authorization:'Bearer '+process.env.AGENT_TOKEN}}).then(r=>{if(!r.ok)process.exit(1)})",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      xray:
        condition: service_healthy
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks: [proxyhub]
    logging: *default-logging

  xray:
    build:
      context: .
      dockerfile: docker/xray.Dockerfile
      args:
        XRAY_CORE_VERSION: 26.5.9
    restart: unless-stopped
    volumes:
      - xray-config:/etc/xray
      - xray-runtime:/var/run/proxyhub
    network_mode: host
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'test -s /var/run/proxyhub/xray.pid && kill -0 $$(cat /var/run/proxyhub/xray.pid) && xray run -test -config /etc/xray/config.json',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN:-localhost}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [proxyhub-web, proxyhub-server]
    healthcheck:
      test: ['CMD', 'caddy', 'version']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks: [proxyhub]
    logging: *default-logging

  network-perf-fixture:
    image: node:24-alpine
    profiles: [runtime-test]
    command: ['node', '/fixture/network-performance-fixture.mjs']
    volumes:
      - ./scripts/docker/network-performance-fixture.mjs:/fixture/network-performance-fixture.mjs:ro
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:8080/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s
    networks: [proxyhub]
    logging: *default-logging

volumes:
  proxyhub-data:
  xray-config:
  xray-runtime:
  caddy-data:
  caddy-config:

networks:
  proxyhub:
