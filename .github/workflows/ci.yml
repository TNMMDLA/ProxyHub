name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.9.0'

jobs:
  quality:
    name: Typecheck, lint, format, test, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  migration:
    name: Fresh and V0.1.1 upgrade migrations
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:migration

  compatibility:
    name: Mihomo and sing-box compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/compat/validate-linux.sh

  docker-build:
    name: Docker Compose build
    runs-on: ubuntu-24.04
    env:
      ENCRYPTION_KEY: ci-only-encryption-key-at-least-32-bytes
      AGENT_TOKEN: ci-only-agent-token-at-least-16-bytes
      PANEL_DOMAIN: localhost
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose pull caddy
      - run: docker compose build proxyhub-web proxyhub-server proxyhub-agent xray
