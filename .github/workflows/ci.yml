name: CI

on:
  push:
    branches: [master, v0.3.1-stabilization]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  PNPM_VERSION: '11.9.0'

jobs:
  quality:
    name: Typecheck, lint, format, test, build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y shellcheck sqlite3 jq
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm test:compat
      - run: pnpm test:manifest
      - run: pnpm test:ops
      - run: pnpm lint:shell
      - run: pnpm test:rulesets
      - run: pnpm build
      - run: pnpm test:runtime-packages

  migration:
    name: Fresh, V0.1.1 and V0.2.1 upgrade migrations
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:migration

  compatibility:
    name: Mihomo and sing-box compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: bash scripts/compat/validate-linux.sh

  docker-build:
    name: Docker Compose build and runtime smoke
    runs-on: ubuntu-24.04
    env:
      ENCRYPTION_KEY: ci-only-encryption-key-at-least-32-bytes
      AGENT_TOKEN: ci-only-agent-token-at-least-16-bytes
      PANEL_DOMAIN: localhost
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - name: Validate release image Compose overlay
        env:
          PROXYHUB_WEB_IMAGE: ghcr.io/example/proxyhub-web@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          PROXYHUB_SERVER_IMAGE: ghcr.io/example/proxyhub-server@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          PROXYHUB_AGENT_IMAGE: ghcr.io/example/proxyhub-agent@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          PROXYHUB_XRAY_IMAGE: ghcr.io/example/proxyhub-xray@sha256:dddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddddd
        run: docker compose -f docker-compose.yml -f docker-compose.release.yml config --quiet
      - run: docker compose pull caddy
      - run: docker compose build proxyhub-web proxyhub-server proxyhub-agent xray
      - name: Start production runtime services
        run: docker compose up -d
      - name: Verify healthy runtime and API
        run: bash scripts/docker/runtime-smoke.sh
      - name: Capture runtime logs
        if: always()
        run: docker compose logs --no-color proxyhub-web proxyhub-server proxyhub-agent xray caddy
      - name: Stop runtime services
        if: always()
        run: docker compose down --volumes --remove-orphans
